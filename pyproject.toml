[project]
name = "sc-dossier"
version = "1.0.0"
description = "A high-fidelity Star Citizen companion app for player and organization dossiers."
authors = [
    {name = "PINK"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "Pillow>=10.2.0",
    "rapidocr-onnxruntime>=1.3.0",
    "pyinstaller>=6.4.0",
    "colorama>=0.4.6",
    "supabase>=2.4.0",
    "keyboard>=0.13.5"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"